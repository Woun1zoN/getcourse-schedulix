services:
  postgres:
    image: postgres:15
    container_name: schedulix-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: schedulix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  getcourse-schedulix:
    build: .
    container_name: getcourse-schedulix
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./state.json:/app/state.json

volumes:
  postgres_data:
  redis_data: